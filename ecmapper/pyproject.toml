[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecmapper"
version = "0.1.0"
description = "Map reactions of constraint-based models to (BRENDA) EC numbers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
dependencies = [
    "cobra",
    "pandas",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ecmapper = "ecmapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: tests that download the real source files (run with -m network)",
]
